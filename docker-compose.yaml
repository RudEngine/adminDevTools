networks:
    laravel:

volumes:
    pgdata:

services:

    site:
        image: nginx:stable-alpine
        container_name: nginx
        ports:
            - 80:80
        volumes:
            - ./:/var/www/
            - ./dockerConfigs/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - database
        networks:
            - laravel

    database:
        image: postgres:17-alpine
        container_name: postgres
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: admin
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: banan530
        volumes:
            - ./dockerConfigs/pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - laravel

    php:
        build:
            context: .
            dockerfile: php.DockerFile
        container_name: php
        volumes:
            - ./:/var/www
        working_dir: /var/www
        ports:
            - "9000:9000"
        networks:
            - laravel

    composer:
        image: composer:latest
        container_name: composer
        volumes:
            - ./:/var/www
        working_dir: /var/www
        depends_on:
            - php
        networks:
            - laravel

    artisan:
        build:
            context: .
            dockerfile: php.DockerFile
        container_name: artisan
        volumes:
            - ./:/var/www
        depends_on:
            database:
                condition: service_healthy
        working_dir: /var/www
        entrypoint: ['php', '/var/www/artisan']
        networks:
            - laravel
