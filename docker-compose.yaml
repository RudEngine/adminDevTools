networks:
    laravel:

volumes:
    pgdata:
    redisdata:

services:

    site:
        image: nginx:stable-alpine
        container_name: nginx
        ports:
            - 80:80
        volumes:
            - ./:/var/www/
            - ./dockerConfigs/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - database
        networks:
            - laravel

    database:
        image: postgres:17-alpine
        container_name: postgres
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: admin
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: banan530
        volumes:
            - ./dockerConfigs/pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - laravel

    redis:
        image: redis:8-alpine
        container_name: redis
        restart: unless-stopped
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - "${REDIS_PASSWORD}"
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
            interval: 5s
            timeout: 3s
            retries: 10
        environment:
            REDIS_PASSWORD: "${REDIS_PASSWORD}"
        networks:
            - laravel

    # llama.cpp в режиме роутера: подхватывает все *.gguf из dockerConfigs/models,
    # модель выбирается полем "model" в запросе (имя файла без .gguf).
    # Параметры моделей (контекст, потоки, thinking) — dockerConfigs/llama/models.ini.
    # OpenAI-совместимый API: http://localhost:${LLAMA_PORT}/v1/chat/completions,
    # из docker-сети — http://llama:8080.
    llama:
        image: ghcr.io/ggml-org/llama.cpp:server
        container_name: llama
        restart: unless-stopped
        command:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --models-dir
            - /models
            - --models-max
            - "${LLAMA_MODELS_MAX:-1}"
            - --models-preset
            - /config/models.ini
        ports:
            - "${LLAMA_PORT:-8080}:8080"
        volumes:
            - ./dockerConfigs/models:/models:ro
            - ./dockerConfigs/llama/models.ini:/config/models.ini:ro
        healthcheck:
            test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - laravel

    php:
        build:
            context: .
            dockerfile: php.DockerFile
        container_name: php
        volumes:
            - ./:/var/www
            - ./dockerConfigs/php/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini
        working_dir: /var/www
        ports:
            - "9000:9000"
        environment:
            PHP_IDE_CONFIG: "serverName=localhost"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - laravel

    queue:
        build:
            context: .
            dockerfile: php.DockerFile
        container_name: queue
        restart: unless-stopped
        volumes:
            - ./:/var/www
            - ./dockerConfigs/php/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini
        working_dir: /var/www
        command: ["php", "/var/www/artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=1"]
        environment:
            PHP_IDE_CONFIG: "serverName=localhost"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - laravel

    composer:
        image: composer:latest
        container_name: composer
        volumes:
            - ./:/var/www
        working_dir: /var/www
        depends_on:
            - php
        networks:
            - laravel

    artisan:
        build:
            context: .
            dockerfile: php.DockerFile
        container_name: artisan
        volumes:
            - ./:/var/www
            - ./dockerConfigs/php/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini
        environment:
            PHP_IDE_CONFIG: "serverName=localhost"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        working_dir: /var/www
        entrypoint: ['php', '/var/www/artisan']
        networks:
            - laravel
