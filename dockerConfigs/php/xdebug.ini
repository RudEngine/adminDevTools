; Xdebug 3 для локальной разработки.
; Файл монтируется в /usr/local/etc/php/conf.d/zz-xdebug.ini,
; поэтому меняется без пересборки образа - достаточно перезапустить контейнер.

; Расширение собрано в образе, но включается только этим файлом,
; поэтому вне локального compose Xdebug не загружается вообще.
zend_extension = xdebug

xdebug.mode = debug,develop

; Сессия стартует только по триггеру:
;   - браузер: закладка/расширение Xdebug helper (cookie XDEBUG_SESSION)
;   - HTTP:    ?XDEBUG_TRIGGER=1 или заголовок X-Debug-Trigger
;   - CLI:     XDEBUG_TRIGGER=1 php artisan ...
xdebug.start_with_request = trigger

xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.discover_client_host = false

; 0 = без логов. Для диагностики подключения поставить 7 и смотреть xdebug.log.
xdebug.log_level = 0