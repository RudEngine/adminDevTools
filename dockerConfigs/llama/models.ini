; Пресеты моделей llama.cpp (router mode, --models-preset).
; Ключи = аргументы llama-server без "--" (можно короткие: c, t, np).
; Приоритет: аргументы command в docker-compose > секция модели > [*].
; После правки: docker compose restart llama

version = 1

; Общие настройки для всех моделей.
[*]
; Размер контекста в токенах.
ctx-size = 4096
; Потоков CPU (-1 = все доступные контейнеру).
threads = -1
; Одновременных запросов на одну модель.
parallel = 1
; Лимит токенов ответа по умолчанию (-1 = без лимита).
n-predict = 1024
temp = 0.7

; Секция с именем файла без .gguf настраивает модель из dockerConfigs/models.
[FineQwen3.5-2B_Q4]
; Без режима рассуждений — сразу отвечает в content.
; Включить для запроса: "chat_template_kwargs": {"enable_thinking": true}
chat-template-kwargs = {"enable_thinking": false}
; Загружать модель сразу при старте контейнера, а не при первом запросе.
load-on-startup = true

; Модель с произвольным именем (файл можно положить куда угодно в /models):
; [my-model]
; model = /models/some-file.gguf
; ctx-size = 8192
