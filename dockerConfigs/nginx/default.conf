server {
    listen 80;
    listen [::]:80;
    # Основной хост (админка) + поддомен API: оба идут в один Laravel,
    # дальше их разводит роутинг по домену (config/app.php → api_domain).
    server_name localhost api.localhost;
    root /var/www/public;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Встроенный DNS Docker. Имя php в fastcgi_pass резолвится на каждый запрос
    # (через переменную), иначе nginx кеширует IP со старта навсегда и после
    # пересоздания контейнера php отдаёт 502 "Host is unreachable".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
